name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a stable version tag on main
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: python -m pip install '.[dev]' twine
      - name: Verify package version matches tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_VERSION#v}"
          PACKAGE_VERSION="$(python -c 'from bootstrapper import __version__; print(__version__)')"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
      - name: Test source
        run: python -m pytest -q -c pyproject.toml tests
      - name: Build release distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Verify installed wheel and generated Python project
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/agent-bootstrap" --help
          "$RUNNER_TEMP/wheel-check/bin/projboot" --help
          "$RUNNER_TEMP/wheel-check/bin/agent-bootstrap" create python-smoke --lang python --no-git --no-graphify
          python -m venv "$RUNNER_TEMP/generated-check"
          "$RUNNER_TEMP/generated-check/bin/python" -m pip install ./python-smoke pytest
          cd "$RUNNER_TEMP/python-smoke"
          "$RUNNER_TEMP/generated-check/bin/python" -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.3
