name: TestPyPI candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: python -m pip install '.[dev]' twine
      - name: Test source
        run: python -m pytest -q
      - name: Build candidate
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/agent-bootstrap" --help
          "$RUNNER_TEMP/wheel-check/bin/projboot" --help
      - uses: actions/upload-artifact@v4
        with:
          name: testpypi-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testpypi-dist
          path: dist/
      - name: Publish candidate to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.12.3
        with:
          repository-url: https://test.pypi.org/legacy/
